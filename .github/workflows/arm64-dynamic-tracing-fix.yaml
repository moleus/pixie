---
# Verifies the arm64 dynamic-tracing (uprobe codegen) fix and publishes a PEM image.
#
# Background: Pixie's dynamic Go tracer emitted x86-only `struct pt_regs` field names
# (ctx->ax/bx/cx/di/si/r8-r11), so every uprobe failed to compile on arm64/Graviton.
# The fix (code_gen.cc + obj_tools/abi_model.{cc,h}) selects the register set by
# architecture. This workflow proves it: x86 still works (BPF tests), arm64 now
# compiles, and it ships a multiarch PEM image to test on a real cluster.
#
# Performance design (why this is fast):
#   * We build & push ONLY the PEM image (//k8s/vizier:pem_image_push), not the full
#     7-image vizier bundle x2 arches. The PEM image (the stirling data collector that
#     runs the uprobe codegen) is the only deliverable the arm64 verification needs.
#     That alone cuts the image build from 14 images to 2.
#   * Each architecture builds + pushes its OWN PEM image inside the job whose Bazel
#     disk cache is already warm for that arch, and the two arch builds run in PARALLEL
#     (previously one giant serial job rebuilt everything for both arches).
#   * Building the aarch64 PEM image compiles the fixed dynamic tracer for aarch64, so it
#     doubles as the arm64 compile check — no separate cross-compile step needed.
#   * We push WITHOUT --config=stamp: the image tag comes from --//k8s:image_version, so
#     stamping is unnecessary, and skipping it lets Bazel cache the pem binary's final
#     link (version_linkstamp) across commits — warm runs skip the expensive relink.
#   * A final tiny `assemble-pem-image` job stitches the multiarch manifest with
#     `crane index append` — no Bazel compilation, so it finishes in seconds.
#   * Running on the default branch (`main`) and on a weekly schedule seeds the shared Bazel
#     disk cache: GitHub only shares the DEFAULT branch's caches across branches, so a warm
#     cache on `main` turns feature-branch cold starts (no own cache yet) into near-warm runs
#     instead of compiling stirling+carnot from scratch.
name: arm64-dynamic-tracing-fix
on:
  workflow_dispatch:
    inputs:
      x86_runner:
        description: 'x86 runner label (larger = faster; e.g. ubuntu-latest or a configured larger runner)'
        default: 'ubuntu-latest'
      arm_runner:
        description: 'arm64 runner label (free for public repos)'
        default: 'ubuntu-24.04-arm'
      image_repo:
        description: 'Registry to push the PEM image to (public)'
        default: 'ghcr.io/moleus'
      push_image:
        description: 'Build & push the multiarch PEM image'
        type: boolean
        default: true
  push:
    branches: ['main', 'arm64-fix', 'fix/arm64-dynamic-tracing', 'claude/wonderful-bell-nm4uhr']
  schedule:
  # Weekly (Sun 07:09 UTC) run on the default branch to keep the shared Bazel disk cache warm
  # (GitHub evicts caches untouched for 7 days), so feature-branch cold starts stay near-warm.
  - cron: '9 7 * * 0'

# Cancel superseded runs on the same ref so iteration doesn't pile up runners or race on
# the per-branch Bazel cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_REPO: ${{ github.event.inputs.image_repo || 'ghcr.io/moleus' }}
  # OPTIONAL shared remote cache. Set repo secret BB_API_KEY (a free BuildBuddy org key, or any
  # bazel-remote/EngFlow key) to give EVERY branch ONE shared read+write Bazel cache, so cold
  # starts nearly vanish (any branch's build warms the cache for all). Empty => local disk cache
  # only (no remote dependency, current behavior). See the "remote cache" step in each build job.
  BB_API_KEY: ${{ secrets.BB_API_KEY }}
  # Scope every Bazel invocation to the dynamic-tracing surface the fix touches, so the
  # build fits comfortably in a free runner + warm cache.
  DT_TARGETS: >-
    //src/stirling/source_connectors/dynamic_tracer/dynamic_tracing/...
    //src/stirling/obj_tools:cc_library
  DT_TESTS: >-
    //src/stirling/source_connectors/dynamic_tracer/dynamic_tracing:code_gen_test
    //src/stirling/source_connectors/dynamic_tracer/dynamic_tracing:dwarvifier_test
    //src/stirling/source_connectors/dynamic_tracer/dynamic_tracing:dynamic_tracer_test
    //src/stirling/source_connectors/dynamic_tracer/dynamic_tracing:goid_test
    //src/stirling/obj_tools:abi_model_test

jobs:
  # ---------------------------------------------------------------------------
  # 1) x86: build the changed targets, RUN the dynamic-tracing BPF tests, then
  #    build & push the x86_64 PEM image — all from this job's warm x86 cache.
  # ---------------------------------------------------------------------------
  test-x86:
    runs-on: ${{ github.event.inputs.x86_runner || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    container:
      image: ghcr.io/pixie-io/dev_image_with_extras:202604270358
      options: --privileged           # needed for BPF/uprobe tests (requires_bpf,requires_root)
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with: { fetch-depth: 0 }
    - run: git config --global --add safe.directory "$(pwd)"
    # Local Bazel disk cache, persisted across runs. No dependency on Pixie's BuildBuddy.
    - uses: actions/cache@v4
      with:
        path: /root/.cache/bazel-disk
        key: bazel-x86-${{ hashFiles('WORKSPACE', 'bazel/**', '.bazelversion') }}
        restore-keys: bazel-x86-
    - name: Bazel config (no BES; disk cache)
      run: |
        echo "build --disk_cache=/root/.cache/bazel-disk" >> .bazelrc.local
        # Reuse sandbox dirs (big win for the hermetic-sysroot, many-small-actions C++ build)
        # and bound the disk cache so it stays under GitHub's 10 GB/repo limit.
        echo "build --experimental_reuse_sandbox_directories" >> .bazelrc.local
        echo "build --experimental_disk_cache_gc_max_size=8G" >> .bazelrc.local
        # Optional shared remote cache: one read+write cache across ALL branches (see env BB_API_KEY).
        if [[ -n "${BB_API_KEY:-}" ]]; then
          echo "build --remote_cache=grpcs://remote.buildbuddy.io" >> .bazelrc.local
          echo "build --remote_header=x-buildbuddy-api-key=${BB_API_KEY}" >> .bazelrc.local
          echo "build --remote_upload_local_results=true" >> .bazelrc.local
          echo "build --experimental_remote_cache_compression" >> .bazelrc.local
          echo "build --remote_timeout=600" >> .bazelrc.local
          echo "remote cache: ENABLED (shared across all branches)"
        else
          echo "remote cache: disabled (set repo secret BB_API_KEY to enable); local disk cache only"
        fi
        echo "import %workspace%/.bazelrc.local" >> .bazelrc
    - name: Build changed targets (amd64)
      run: bazel build --config=clang ${DT_TARGETS}
    - name: Run dynamic-tracing unit + integration tests (amd64)
      run: bazel test --config=clang --test_output=errors ${DT_TESTS}
    - name: Login to GHCR
      if: ${{ github.event.inputs.push_image != 'false' }}
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Build & push x86_64 PEM image
      if: ${{ github.event.inputs.push_image != 'false' }}
      shell: bash
      run: |
        set -ex
        TAG="arm64-fix-${GITHUB_SHA::9}"
        # Inline of ci/image_utils.sh:push_images_for_arch, but WITHOUT --config=stamp.
        # The image tag is set by --//k8s:image_version, so stamping is unnecessary;
        # skipping it lets Bazel cache the pem final link across commits.
        bazel run -c opt --config=x86_64_sysroot \
          --//k8s:image_repository="${IMAGE_REPO}" \
          --//k8s:image_version="${TAG}-x86_64" \
          //k8s/vizier:pem_image_push >/dev/null
        echo "PUSHED x86_64 PEM: ${IMAGE_REPO}/vizier-pem_image:${TAG}-x86_64"

  # ---------------------------------------------------------------------------
  # 2) arm64: build & push the aarch64 PEM image. Cross-compiling the PEM image
  #    compiles the fixed dynamic tracer for aarch64 (the `#if defined(__aarch64__)`
  #    branch), so this is both the arm64 compile check and the aarch64 deliverable.
  #    (BPF tests can't run under qemu cross-emulation; real arm64 runtime is verified
  #    on the cluster with the published image.)
  # ---------------------------------------------------------------------------
  build-arm64:
    runs-on: ${{ github.event.inputs.x86_runner || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    container:
      image: ghcr.io/pixie-io/dev_image_with_extras:202604270358
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with: { fetch-depth: 0 }
    - run: git config --global --add safe.directory "$(pwd)"
    - uses: actions/cache@v4
      with:
        path: /root/.cache/bazel-disk
        key: bazel-arm-${{ hashFiles('WORKSPACE', 'bazel/**', '.bazelversion') }}
        restore-keys: bazel-arm-
    - name: Bazel config
      run: |
        echo "build --disk_cache=/root/.cache/bazel-disk" >> .bazelrc.local
        echo "build --experimental_reuse_sandbox_directories" >> .bazelrc.local
        echo "build --experimental_disk_cache_gc_max_size=8G" >> .bazelrc.local
        # Optional shared remote cache: one read+write cache across ALL branches (see env BB_API_KEY).
        if [[ -n "${BB_API_KEY:-}" ]]; then
          echo "build --remote_cache=grpcs://remote.buildbuddy.io" >> .bazelrc.local
          echo "build --remote_header=x-buildbuddy-api-key=${BB_API_KEY}" >> .bazelrc.local
          echo "build --remote_upload_local_results=true" >> .bazelrc.local
          echo "build --experimental_remote_cache_compression" >> .bazelrc.local
          echo "build --remote_timeout=600" >> .bazelrc.local
          echo "remote cache: ENABLED (shared across all branches)"
        else
          echo "remote cache: disabled (set repo secret BB_API_KEY to enable); local disk cache only"
        fi
        echo "import %workspace%/.bazelrc.local" >> .bazelrc
    - name: Login to GHCR
      if: ${{ github.event.inputs.push_image != 'false' }}
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Build & push aarch64 PEM image
      if: ${{ github.event.inputs.push_image != 'false' }}
      shell: bash
      run: |
        set -ex
        TAG="arm64-fix-${GITHUB_SHA::9}"
        # Cross-compiles the fixed dynamic tracer for aarch64 as part of the PEM image.
        bazel run -c opt --config=aarch64_sysroot \
          --//k8s:image_repository="${IMAGE_REPO}" \
          --//k8s:image_version="${TAG}-aarch64" \
          //k8s/vizier:pem_image_push >/dev/null
        echo "PUSHED aarch64 PEM: ${IMAGE_REPO}/vizier-pem_image:${TAG}-aarch64"
    - name: Cross-compile the PEM image for aarch64 (verification only)
      # When not pushing, still prove the aarch64 PEM image compiles end-to-end.
      if: ${{ github.event.inputs.push_image == 'false' }}
      run: bazel build --config=aarch64_sysroot //src/vizier/services/agent/pem:pem_image

  # ---------------------------------------------------------------------------
  # 3) Assemble the MULTIARCH PEM image from the two per-arch images pushed above.
  #    This is pure manifest surgery (crane) — no Bazel build — so it's seconds.
  #    Deploy this image's arm64 manifest to a Graviton cluster to verify the fix.
  # ---------------------------------------------------------------------------
  assemble-pem-image:
    if: ${{ github.event.inputs.push_image != 'false' }}
    needs: [test-x86, build-arm64]
    runs-on: ${{ github.event.inputs.x86_runner || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    container:
      image: ghcr.io/pixie-io/dev_image_with_extras:202604270358
    env:
      # Optional: set COSIGN_PRIVATE_KEY / COSIGN_PASSWORD secrets to sign; otherwise skipped.
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with: { fetch-depth: 1 }
    - run: git config --global --add safe.directory "$(pwd)"
    - name: Login to GHCR
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Assemble multiarch PEM manifest
      shell: bash
      run: |
        set -ex
        TAG="arm64-fix-${GITHUB_SHA::9}"
        IMG="${IMAGE_REPO}/vizier-pem_image"
        crane index append \
          --manifest "${IMG}:${TAG}-x86_64" \
          --manifest "${IMG}:${TAG}-aarch64" \
          --tag "${IMG}:${TAG}"
        echo "PUSHED PEM: ${IMG}:${TAG}"
        if [[ -n "${COSIGN_PRIVATE_KEY:-}" ]]; then
          digest="$(crane digest "${IMG}:${TAG}")"
          cosign sign --key env://COSIGN_PRIVATE_KEY --yes -r "${IMG}:${TAG}@${digest}"
        else
          echo "cosign key not set; skipping signature for ${IMG}:${TAG}"
        fi
        echo "## Deploy this PEM to a Graviton node to verify:" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        echo "kubectl -n pixie set image ds/vizier-pem pem=${IMG}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
