---
# Verifies the arm64 dynamic-tracing (uprobe codegen) fix and publishes a multiarch PEM image.
#
# Performance design (all optimizations):
#   * Build & push ONLY the PEM image (//k8s/vizier:pem_image_push), per-arch, in PARALLEL — not the
#     full 7-image vizier bundle x2 arches (14 image builds -> 2).
#   * test-x86 (DT build + BPF tests, --config=clang) and build-x86-pem (the x86_64 PEM image,
#     -c opt --config=x86_64_sysroot) are SPLIT into parallel jobs: they compile disjoint Bazel
#     configurations that share no objects, so one job would just serialize two full compiles.
#   * build-arm64 cross-compiles + pushes the aarch64 PEM (which also compiles the arm64 fix).
#   * Push WITHOUT --config=stamp so the pem final link is cached across commits.
#   * Push with --remote_download_outputs=toplevel: `bazel run` otherwise (via .bazelrc `run
#     --remote_download_outputs=all`) hydrates ALL ~5300 cached action outputs to the runner; we only
#     need the final image, so toplevel skips ~158MB of intermediate .o/.a downloads (the warm bottleneck).
#   * With the remote cache on, --jobs=50 (cache fetches are network-bound, not CPU-bound) and
#     --experimental_remote_merkle_tree_cache speed the cache-hit-heavy graph.
#   * assemble-pem-image installs crane on a bare runner (no multi-GB dev-image pull) and stitches the
#     multiarch manifest in seconds.
#   * SHARED REMOTE CACHE (BuildBuddy) when secret BB_API_KEY is set: every branch reads AND writes
#     ONE cache, so cold starts on any branch are near-eliminated. Falls back to local disk cache
#     (no remote dependency) when the secret is absent.
#   * Local --disk_cache (persisted via actions/cache) is the per-branch L1 in front of the remote
#     cache; per-arch keys fall back (restore-keys) to a prior combined cache to stay warm.
#   * Default-branch (main) + weekly schedule runs seed the shared caches so feature branches start warm.
#   * Bazel flags tuned for this build: reuse sandbox dirs, bound the disk cache <10GB, and drop DWARF
#     from fastbuild C++ (-g0) for a faster/smaller DT build (opt is already -g0, so the image is unchanged).
#   * Bazel --output_base + --disk_cache live on the runner's /mnt volume (~70GB) instead of the ~20GB
#     root fs, so cold image builds don't hit "No space left on device" (which forced a rerun before).
#   * Build jobs use the base dev_image (not dev_image_with_extras): the container pull is
#     extraction-bound (decompress/untar on few vCPUs), so the smaller base image shaves per-job startup.
name: arm64-dynamic-tracing-fix
on:
  workflow_dispatch:
    inputs:
      x86_runner:
        description: 'x86 runner label (larger = faster; e.g. ubuntu-latest or a configured larger runner)'
        default: 'ubuntu-latest'
      arm_runner:
        description: 'arm64 runner label (free for public repos)'
        default: 'ubuntu-24.04-arm'
      image_repo:
        description: 'Registry to push the PEM image to (public)'
        default: 'ghcr.io/moleus'
      push_image:
        description: 'Build & push the multiarch PEM image'
        type: boolean
        default: true
  push:
    branches: ['main', 'arm64-fix', 'fix/arm64-dynamic-tracing', 'claude/wonderful-bell-nm4uhr']
    paths-ignore: ['**.md']   # don't run the expensive image build for docs-only changes
  schedule:
  # Weekly (Sun 07:09 UTC) on the default branch to keep the shared Bazel cache warm
  # (GitHub evicts caches untouched for 7 days), so feature-branch cold starts stay near-warm.
  - cron: '9 7 * * 0'

# Cancel superseded runs on the same ref so iteration doesn't pile up runners or race on the cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_REPO: ${{ github.event.inputs.image_repo || 'ghcr.io/moleus' }}
  # OPTIONAL shared remote cache. Set repo secret BB_API_KEY (a free BuildBuddy org key with cache
  # write, or any bazel-remote/EngFlow key) to give EVERY branch ONE shared read+write Bazel cache,
  # so cold starts nearly vanish. Empty => local disk cache only (current behavior, no remote dep).
  BB_API_KEY: ${{ secrets.BB_API_KEY }}
  DT_TARGETS: >-
    //src/stirling/source_connectors/dynamic_tracer/dynamic_tracing/...
    //src/stirling/obj_tools:cc_library
  DT_TESTS: >-
    //src/stirling/source_connectors/dynamic_tracer/dynamic_tracing:code_gen_test
    //src/stirling/source_connectors/dynamic_tracer/dynamic_tracing:dwarvifier_test
    //src/stirling/source_connectors/dynamic_tracer/dynamic_tracing:dynamic_tracer_test
    //src/stirling/source_connectors/dynamic_tracer/dynamic_tracing:goid_test
    //src/stirling/obj_tools:abi_model_test

jobs:
  # 1) x86 tests only (no image): build the dynamic-tracing surface and RUN the BPF/unit tests.
  test-x86:
    runs-on: ${{ github.event.inputs.x86_runner || 'ubuntu-latest' }}
    container:
      image: ghcr.io/pixie-io/dev_image:202604270358
      options: --privileged           # needed for BPF/uprobe tests (requires_bpf,requires_root)
      volumes:
      - /mnt:/mnt                      # host temp disk (~70GB) for Bazel output_base + disk cache
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with: { fetch-depth: 1 }
    - run: git config --global --add safe.directory "$(pwd)"
    - uses: actions/cache@v4
      with:
        path: /mnt/bazel-disk
        key: bazel-x86dt-v4-${{ hashFiles('WORKSPACE', 'bazel/**', '.bazelversion') }}
        restore-keys: |
          bazel-x86dt-v4-
    - name: Bazel config
      shell: bash
      run: |
        {
          echo "startup --output_base=/mnt/bazelroot"
          echo "build --disk_cache=/mnt/bazel-disk"
          echo "build --experimental_reuse_sandbox_directories"
          echo "build --experimental_disk_cache_gc_max_size=8G"
          echo "build --experimental_merged_skyframe_analysis_execution"
          echo "build:clang --copt=-g0"
        } >> .bazelrc.local
        if [[ -n "${BB_API_KEY:-}" ]]; then
          {
            echo "build --remote_cache=grpcs://remote.buildbuddy.io"
            echo "build --remote_header=x-buildbuddy-api-key=${BB_API_KEY}"
            echo "build --remote_upload_local_results=true"
            echo "build --experimental_remote_cache_compression"
            echo "build --remote_timeout=600"
            echo "build --jobs=50"
            echo "build --experimental_remote_merkle_tree_cache"
          } >> .bazelrc.local
          echo "remote cache: ENABLED (shared across all branches)"
        else
          echo "remote cache: disabled (set repo secret BB_API_KEY to enable); local disk cache only"
        fi
        echo "import %workspace%/.bazelrc.local" >> .bazelrc
    - name: Build changed targets (amd64)
      run: bazel build --config=clang ${DT_TARGETS}
    - name: Run dynamic-tracing unit + integration tests (amd64)
      run: bazel test --config=clang --test_output=errors ${DT_TESTS}

  # 2) x86 PEM image (parallel with tests): build & push the x86_64 PEM image.
  build-x86-pem:
    if: ${{ github.event.inputs.push_image != 'false' }}
    runs-on: ${{ github.event.inputs.x86_runner || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    container:
      image: ghcr.io/pixie-io/dev_image:202604270358
      volumes:
      - /mnt:/mnt                      # host temp disk (~70GB) for Bazel output_base + disk cache
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with: { fetch-depth: 1 }
    - run: git config --global --add safe.directory "$(pwd)"
    - uses: actions/cache@v4
      with:
        path: /mnt/bazel-disk
        key: bazel-x86pem-v4-${{ hashFiles('WORKSPACE', 'bazel/**', '.bazelversion') }}
        restore-keys: |
          bazel-x86pem-v4-
    - name: Bazel config
      shell: bash
      run: |
        {
          echo "startup --output_base=/mnt/bazelroot"
          echo "build --disk_cache=/mnt/bazel-disk"
          echo "build --experimental_reuse_sandbox_directories"
          echo "build --experimental_disk_cache_gc_max_size=8G"
          echo "build --experimental_merged_skyframe_analysis_execution"
          echo "build:clang --copt=-g0"
        } >> .bazelrc.local
        if [[ -n "${BB_API_KEY:-}" ]]; then
          {
            echo "build --remote_cache=grpcs://remote.buildbuddy.io"
            echo "build --remote_header=x-buildbuddy-api-key=${BB_API_KEY}"
            echo "build --remote_upload_local_results=true"
            echo "build --experimental_remote_cache_compression"
            echo "build --remote_timeout=600"
            echo "build --jobs=50"
            echo "build --experimental_remote_merkle_tree_cache"
          } >> .bazelrc.local
          echo "remote cache: ENABLED (shared across all branches)"
        else
          echo "remote cache: disabled (set repo secret BB_API_KEY to enable); local disk cache only"
        fi
        echo "import %workspace%/.bazelrc.local" >> .bazelrc
    - name: Login to GHCR
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Build & push x86_64 PEM image
      shell: bash
      run: |
        set -ex
        TAG="arm64-fix-${GITHUB_SHA::9}"
        bazel run -c opt --config=x86_64_sysroot \
          --remote_download_outputs=toplevel \
          --//k8s:image_repository="${IMAGE_REPO}" \
          --//k8s:image_version="${TAG}-x86_64" \
          //k8s/vizier:pem_image_push >/dev/null
        echo "PUSHED x86_64 PEM: ${IMAGE_REPO}/vizier-pem_image:${TAG}-x86_64"

  # 3) aarch64 PEM image: cross-compile + push (also the arm64 compile check).
  build-arm64:
    runs-on: ${{ github.event.inputs.x86_runner || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    container:
      image: ghcr.io/pixie-io/dev_image:202604270358
      volumes:
      - /mnt:/mnt                      # host temp disk (~70GB) for Bazel output_base + disk cache
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      with: { fetch-depth: 1 }
    - run: git config --global --add safe.directory "$(pwd)"
    - uses: actions/cache@v4
      with:
        path: /mnt/bazel-disk
        key: bazel-arm-v4-${{ hashFiles('WORKSPACE', 'bazel/**', '.bazelversion') }}
        restore-keys: bazel-arm-v4-
    - name: Bazel config
      shell: bash
      run: |
        {
          echo "startup --output_base=/mnt/bazelroot"
          echo "build --disk_cache=/mnt/bazel-disk"
          echo "build --experimental_reuse_sandbox_directories"
          echo "build --experimental_disk_cache_gc_max_size=8G"
          echo "build --experimental_merged_skyframe_analysis_execution"
          echo "build:clang --copt=-g0"
        } >> .bazelrc.local
        if [[ -n "${BB_API_KEY:-}" ]]; then
          {
            echo "build --remote_cache=grpcs://remote.buildbuddy.io"
            echo "build --remote_header=x-buildbuddy-api-key=${BB_API_KEY}"
            echo "build --remote_upload_local_results=true"
            echo "build --experimental_remote_cache_compression"
            echo "build --remote_timeout=600"
            echo "build --jobs=50"
            echo "build --experimental_remote_merkle_tree_cache"
          } >> .bazelrc.local
          echo "remote cache: ENABLED (shared across all branches)"
        else
          echo "remote cache: disabled (set repo secret BB_API_KEY to enable); local disk cache only"
        fi
        echo "import %workspace%/.bazelrc.local" >> .bazelrc
    - name: Login to GHCR
      if: ${{ github.event.inputs.push_image != 'false' }}
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Build & push aarch64 PEM image
      if: ${{ github.event.inputs.push_image != 'false' }}
      shell: bash
      run: |
        set -ex
        TAG="arm64-fix-${GITHUB_SHA::9}"
        bazel run -c opt --config=aarch64_sysroot \
          --remote_download_outputs=toplevel \
          --//k8s:image_repository="${IMAGE_REPO}" \
          --//k8s:image_version="${TAG}-aarch64" \
          //k8s/vizier:pem_image_push >/dev/null
        echo "PUSHED aarch64 PEM: ${IMAGE_REPO}/vizier-pem_image:${TAG}-aarch64"
    - name: Cross-compile the PEM image for aarch64 (verification only)
      if: ${{ github.event.inputs.push_image == 'false' }}
      run: bazel build --config=aarch64_sysroot //src/vizier/services/agent/pem:pem_image

  # 4) Assemble the multiarch PEM manifest. Pure manifest surgery with crane (no Bazel build), so it
  #    runs on a BARE runner and installs crane (a single static binary) instead of pulling the
  #    multi-GB dev image just to get crane (~84s saved). Gated on tests passing (needs test-x86).
  assemble-pem-image:
    if: ${{ github.event.inputs.push_image != 'false' }}
    needs: [test-x86, build-x86-pem, build-arm64]
    runs-on: ${{ github.event.inputs.x86_runner || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    env:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    steps:
    - name: Login to GHCR
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Assemble multiarch PEM manifest (crane)
      shell: bash
      run: |
        set -ex
        # crane + cosign are single static binaries; install the latest release (no dev image needed).
        # GitHub's /releases/latest/download/ redirect avoids pinning a version; asset names are stable.
        mkdir -p "$HOME/bin"
        curl -fsSL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz \
          | tar -xz -C "$HOME/bin" crane
        export PATH="$HOME/bin:$PATH"
        crane version
        TAG="arm64-fix-${GITHUB_SHA::9}"
        IMG="${IMAGE_REPO}/vizier-pem_image"
        crane index append \
          --manifest "${IMG}:${TAG}-x86_64" \
          --manifest "${IMG}:${TAG}-aarch64" \
          --tag "${IMG}:${TAG}"
        echo "PUSHED PEM: ${IMG}:${TAG}"
        if [[ -n "${COSIGN_PRIVATE_KEY:-}" ]]; then
          curl -fsSL -o "$HOME/bin/cosign" https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x "$HOME/bin/cosign"
          digest="$(crane digest "${IMG}:${TAG}")"
          cosign sign --key env://COSIGN_PRIVATE_KEY --yes -r "${IMG}:${TAG}@${digest}"
        else
          echo "cosign key not set; skipping signature for ${IMG}:${TAG}"
        fi
        echo "## Deploy this PEM to a Graviton node to verify:" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        echo "kubectl -n pixie set image ds/vizier-pem pem=${IMG}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
